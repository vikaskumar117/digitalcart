<div class="container py-4">
  <h3>Your Cart</h3>

  <div class="mt-3 mb-4">
    <button class="btn btn-primary" (click)="addMoreProducts()">Add More Products</button>
  </div>

  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty.</p>
  </div>

  <div *ngIf="cartItems.length > 0">
    <div class="row cart-item" *ngFor="let item of cartItems">
      <div class="col-md-2">
        <img [src]="item.src" class="img-fluid" alt="cart item" />
      </div>
      <div class="col-md-6">
        <h5>{{ item.name }}</h5>
        <p>{{ item.description }}</p>
        <p>₹ {{ item.price }}</p>
      </div>
      <div class="col-md-4 text-right">
        <div class="qty-box">
          <button class="btn btn-sm btn-outline-secondary" (click)="decrease(item)">-</button>
          <span>{{ item.quantity }}</span>
          <button class="btn btn-sm btn-outline-secondary" (click)="increase(item)">+</button>
        </div>
        <button class="btn btn-danger mt-2" (click)="remove(item)">Remove</button>
      </div>
    </div>

    <div class="order-summary mt-4">
      <h4>Total: ₹ {{ total }}</h4>
      <button class="btn btn-success" (click)="placeOrder()">Place Order</button>
    </div>
  </div>
</div>
